[workspace]
members = ["bench"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[package]
name = "nfs-crust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Async Rust NFSv4.1 client library without an OS mount point"
readme = "README.md"
documentation = "https://docs.rs/nfs-crust"
repository = "https://github.com/s2-streamstore/nfs-crust"
keywords = ["async", "filesystem", "nfs", "nfsv4", "tokio"]
categories = ["asynchronous", "filesystem", "network-programming"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[features]
default = []
aws-efs = [
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:rcgen",
    "dep:sha1",
    "dep:sha2",
    "dep:time",
    "dep:yasna",
    "dep:zeroize",
]

[dependencies]
aws-credential-types = { version = "1.2.11", optional = true }
aws-sigv4 = { version = "1.3.8", default-features = false, optional = true }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
parking_lot = "0.12"
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "zeroize"], optional = true }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pki-types = "1.15.0"
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
smallvec = "1"
thiserror = "2"
time = { version = "0.3", optional = true }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
ulid = "1"
webpki-roots = "1.0.8"
yasna = { version = "0.6", features = ["std", "time"], optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
embednfs = "0.4.1"
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
